# Important: every field here that is referenced in buildSrc/.../multiloader-common.gradle
# expandProps must exist, or processResources will fail.

# Project
version=1.2.0
group=com.simplefun
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Simplefun
mod_author=Ouzzi
mod_id=simplefun
license=CC0-1.0
credits=
description=Small tweaks, big fun: configurable Vanilla+ features - Yeet, throwable bricks, Brick Snowball, piggy transformation, player-head drops and a No-Damage enchantment.

# Fabric, see https://fabricmc.net/develop/
fabric_version=0.139.5+1.21.11
fabric_loader_version=0.18.2

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.11.42
neoforge_loader_version_range=[4,)

# Cloth Config (config GUI) - has both fabric and neoforge builds. https://maven.shedaniel.me/
cloth_config_version=21.11.151
# Mod Menu (Fabric only - in-game config button). https://maven.terraformersmc.com/
modmenu_version=17.0.0-alpha.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
